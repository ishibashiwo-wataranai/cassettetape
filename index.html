<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>民謡カセット</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at top, #2c2f33 0%, #16181b 70%, #0d0e10 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
  }

  /* ── 4:3 固定コンテナ ── */
  .app {
    --w: min(100vw, calc(100svh * 4 / 3), 1024px);
    width: var(--w);
    height: calc(var(--w) * 3 / 4);
    display: flex;
    background: #1c1e21;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 0 1px #3a3d42;
  }

  /* =============================================
     左：カセットプレイヤー
  ============================================= */
  .player-panel {
    flex: 3;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #3c4045 0%, #2a2d31 100%);
    border-right: 3px solid #111214;
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 1.8vw, 18px);
    gap: clamp(8px, 1.2vw, 14px);
    /* 天面に金属光沢ライン */
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
  }

  .player-header {
    text-align: center;
    font-size: clamp(1rem, 2vw, 1.5rem);
    font-weight: 700;
    color: #c9a96e;
    letter-spacing: 0.3em;
    flex-shrink: 0;
    text-shadow: 0 1px 0 rgba(0,0,0,0.8);
  }

  /* カセットベイ（デッキ本体） */
  .cassette-bay {
    flex-shrink: 0;
    background: linear-gradient(160deg, #4a4e54 0%, #33363b 100%);
    border-radius: 10px;
    border: 2px solid #1a1b1e;
    box-shadow:
      0 3px 8px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.5);
    padding: clamp(8px, 1.2vw, 13px);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* デッキ上部：銘板 */
  .bay-brand {
    font-size: clamp(0.55rem, 1vw, 0.75rem);
    font-weight: 700;
    color: #9a9ea5;
    letter-spacing: 0.25em;
    text-align: right;
    padding-right: 4px;
  }

  /* カセット窓 */
  .slot-window {
    background: #0c0d0f;
    border-radius: 6px;
    border: 3px solid #1a1b1e;
    box-shadow:
      inset 0 4px 14px rgba(0,0,0,0.95),
      inset 0 0 0 1px #2a2520;
    min-height: clamp(72px, 11vw, 100px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 1.2vw, 12px);
    transition: box-shadow 0.2s;
  }
  .slot-window.drag-over {
    box-shadow:
      inset 0 4px 14px rgba(0,0,0,0.95),
      inset 0 0 0 2px #c9a96e,
      0 0 0 2px #c9a96e;
  }

  .slot-hint {
    background: rgba(245, 232, 192, 0.15);
    border: 1.5px dashed #6a5a3e;
    border-radius: 8px;
    padding: clamp(8px, 1.2vw, 14px) clamp(14px, 2vw, 24px);
    color: #c9a96e;
    font-size: clamp(0.75rem, 1.3vw, 1rem);
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.08em;
    pointer-events: none;
  }

  /* セットされたカセット */
  .slot-cassette {
    width: 100%;
    max-width: clamp(200px, 34vw, 340px);
    height: clamp(54px, 8.5vw, 78px);
    background: linear-gradient(160deg, var(--cas, #2f3b52), color-mix(in srgb, var(--cas, #2f3b52) 60%, #000));
    border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,0.15);
    position: relative;
    display: none;
  }
  .slot-cassette.loaded {
    display: block;
    animation: insertSlide 0.3s ease;
  }
  @keyframes insertSlide {
    from { transform: translateY(-14px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .slot-label {
    position: absolute;
    top: clamp(5px, 0.8vw, 8px);
    left: clamp(10px, 1.5vw, 16px);
    right: clamp(10px, 1.5vw, 16px);
    height: clamp(22px, 3.5vw, 30px);
    background: #e8e0cc;
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(0.62rem, 1.1vw, 0.85rem);
    font-weight: 700; color: #2a1a10;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 0 8px;
  }
  .slot-reels {
    position: absolute;
    bottom: clamp(4px, 0.7vw, 6px);
    left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 clamp(12px, 2vw, 20px);
  }
  .slot-reel {
    width: clamp(18px, 2.8vw, 26px); height: clamp(18px, 2.8vw, 26px);
    border-radius: 50%;
    background: conic-gradient(#444 0deg,#666 60deg,#444 120deg,#666 180deg,#444 240deg,#666 300deg,#444 360deg);
    border: 2px solid #666; flex-shrink: 0;
  }
  .slot-reel.spin { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slot-tape-win {
    flex: 1; max-width: clamp(36px, 5.5vw, 58px);
    height: clamp(10px, 1.5vw, 14px);
    background: #0c0d0f; border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; margin: 0 4px;
  }
  .slot-notch {
    position: absolute; bottom: 0;
    width: clamp(8px, 1.2vw, 11px); height: clamp(8px, 1.2vw, 11px);
    background: #0c0d0f;
  }
  .slot-notch.l { left: 0; border-radius: 0 5px 0 0; }
  .slot-notch.r { right: 0; border-radius: 5px 0 0 0; }

  /* 映像スクリーン */
  .video-screen {
    flex: 1;
    background: #000;
    border-radius: 6px;
    border: 3px solid #1a1b1e;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
  }
  #yt-player { width: 100%; height: 100%; }
  #yt-player iframe { width: 100% !important; height: 100% !important; display: block; }

  .screen-overlay {
    position: absolute; inset: 0;
    background: #0c0d0f;
    display: flex; align-items: center; justify-content: center;
    color: #5a5e66;
    font-size: clamp(0.7rem, 1.2vw, 0.95rem);
    pointer-events: all;
    transition: opacity 0.3s;
  }
  .screen-overlay.hidden { opacity: 0; pointer-events: none; }

  /* トランスポートボタン（実物感のある3D） */
  .transport {
    display: flex; gap: clamp(5px, 1vw, 12px);
    justify-content: center; flex-shrink: 0;
    background: linear-gradient(180deg, #2a2d31 0%, #1f2124 100%);
    border-radius: 8px;
    border: 2px solid #111214;
    padding: clamp(7px, 1.2vw, 12px) clamp(10px, 1.8vw, 20px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.2);
  }

  .t-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }

  .t-btn {
    height: clamp(38px, 6.5vw, 58px);
    min-width: clamp(38px, 6.5vw, 56px);
    padding: 0 clamp(6px, 1.2vw, 14px);
    border-radius: 8px;
    --c1: #e0dbd2; --c2: #c8c3ba; --c3: #8a8480;
    border: 1.5px solid var(--c3);
    background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    font-size: clamp(1rem, 1.8vw, 1.4rem);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 var(--c3), 0 5px 6px rgba(0,0,0,0.25);
    transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
    font-family: inherit;
  }
  .t-btn:hover { filter: brightness(1.08); }
  .t-btn   { --c1: #55595f; --c2: #3a3d42; --c3: #18191c; color: #d8dade; }
  .t-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--c3), 0 2px 3px rgba(0,0,0,0.2);
  }
  #btn-play.on { --c1: #d4b479; --c2: #a8844a; --c3: #5e4824; color: #1a1408; text-shadow: none; }
  .t-label {
    font-size: clamp(0.52rem, 0.9vw, 0.72rem);
    color: #8a8e95;
    font-weight: 700;
    white-space: nowrap;
  }

  /* =============================================
     右：カセット棚
  ============================================= */
  .shelf-panel {
    flex: 2;
    background: linear-gradient(180deg, #2b221c 0%, #1e1814 100%);
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 1.5vw, 16px);
    gap: clamp(8px, 1.2vw, 12px);
    border-left: 1px solid #0d0e10;
  }

  .shelf-header {
    text-align: center;
    font-size: clamp(1rem, 2vw, 1.5rem);
    font-weight: 700;
    color: #c9a96e;
    letter-spacing: 0.25em;
    flex-shrink: 0;
  }

  .shelf-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
    gap: clamp(6px, 1vw, 10px);
    padding-right: 4px;
  }
  .shelf-list::-webkit-scrollbar { width: 5px; }
  .shelf-list::-webkit-scrollbar-track { background: transparent; }
  .shelf-list::-webkit-scrollbar-thumb { background: #5e4824; border-radius: 3px; }

  /* 棚のカセット（シンプル化、リールなし） */
  .shelf-item {
    position: relative; flex-shrink: 0;
    cursor: grab; touch-action: none; user-select: none;
  }
  .shelf-cassette {
    width: 100%;
    height: clamp(44px, 7vw, 64px);
    background: linear-gradient(160deg, var(--cas, #2f3b52), color-mix(in srgb, var(--cas, #2f3b52) 60%, #000));
    border-radius: 7px;
    border: 1.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 2px 8px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    padding: clamp(6px, 1vw, 10px) clamp(10px, 1.5vw, 16px);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  }
  .shelf-item:hover .shelf-cassette {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
  }
  .shelf-item.dragging .shelf-cassette { opacity: 0.25; }
  .shelf-item.in-player .shelf-cassette { border-color: #c9a96e; box-shadow: 0 0 0 2px #c9a96e, 0 2px 8px rgba(0,0,0,0.4); }

  .shelf-cas-label {
    flex: 1;
    background: #e8e0cc;
    border-radius: 4px;
    padding: clamp(5px, 0.8vw, 8px) clamp(8px, 1.2vw, 12px);
    font-size: clamp(0.82rem, 1.5vw, 1.1rem);
    font-weight: 700;
    color: #2a1a10;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .del-btn {
    margin-left: clamp(6px, 1vw, 10px);
    width: clamp(22px, 3.2vw, 28px); height: clamp(22px, 3.2vw, 28px);
    border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.35); color: #9a9ea5;
    font-size: clamp(0.55rem, 0.9vw, 0.75rem);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
  }
  .del-btn:hover { color: #d06a5a; border-color: #d06a5a; }

  .add-btn {
    width: 100%;
    padding: clamp(10px, 1.6vw, 15px);
    border: 1.5px solid #6a5a3e;
    border-radius: 9px;
    background: transparent; color: #c9a96e;
    font-size: clamp(0.85rem, 1.5vw, 1.05rem);
    font-family: inherit; font-weight: 700;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.2s;
  }
  .add-btn:hover { background: rgba(201,169,110,0.1); }

  /* =============================================
     ドラッグゴースト
  ============================================= */
  .ghost {
    position: fixed; pointer-events: none; z-index: 500;
    width: 160px; height: 48px;
    background: linear-gradient(160deg, var(--cas, #2f3b52), color-mix(in srgb, var(--cas, #2f3b52) 60%, #000));
    border-radius: 7px;
    border: 1.5px solid #c9a96e;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    padding: 6px 10px;
    transform: rotate(-4deg);
  }
  .ghost.show { display: flex; }
  .ghost-label {
    background: #e8e0cc;
    border-radius: 3px; padding: 3px 8px;
    font-size: 0.78rem; font-weight: 700; color: #2a1a10;
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* =============================================
     追加ダイアログ
  ============================================= */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 200;
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }

  .dialog {
    background: #232528; border-radius: 14px; border: 1px solid #3a3d42;
    padding: clamp(20px, 3vw, 32px);
    width: min(90vw, 440px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .dialog h2 { font-size: clamp(1.15rem, 2vw, 1.4rem); color: #e8e0cc; margin-bottom: 18px; font-weight: 700; }
  .dialog label { display: block; font-size: clamp(0.95rem, 1.5vw, 1.05rem); font-weight: 700; color: #c9a96e; margin-bottom: 6px; margin-top: 15px; }
  .dialog label:first-of-type { margin-top: 0; }
  .dialog input[type=text] {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #44474d; border-radius: 8px; background: #16181b;
    font-size: clamp(0.95rem, 1.5vw, 1.05rem); font-family: inherit; color: #e8e0cc;
  }
  .dialog input:focus { outline: none; border-color: #c9a96e; }
  .d-error { font-size: clamp(0.85rem, 1.3vw, 0.95rem); color: #e07a6a; margin-top: 8px; min-height: 1.3em; }
  .d-btns { display: flex; gap: 10px; margin-top: 20px; }
  .d-ok {
    flex: 1; padding: 13px;
    background: #a8844a; color: #1a1408;
    border: none; border-radius: 8px;
    font-size: clamp(0.95rem, 1.5vw, 1.05rem); font-family: inherit; font-weight: 700; cursor: pointer;
  }
  .d-ok:hover { filter: brightness(1.1); }
  .d-cancel {
    padding: 13px 20px; background: transparent; color: #9a9ea5;
    border: 1px solid #44474d; border-radius: 8px;
    font-size: clamp(0.95rem, 1.5vw, 1.05rem); font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app">

  <!-- 左：カセットプレイヤー -->
  <div class="player-panel">

    <div class="player-header">カ セ ッ ト デ ッ キ</div>

    <!-- カセットデッキ本体 -->
    <div class="cassette-bay">
      <div class="bay-brand">CASSETTE DECK</div>
      <div class="slot-window" id="drop-zone">
        <div class="slot-hint" id="slot-hint">ここにカセットを入れてください</div>
        <div class="slot-cassette" id="slot-cassette">
          <div class="slot-label" id="slot-label"></div>
          <div class="slot-reels">
            <div class="slot-reel" id="reel-l"></div>
            <div class="slot-tape-win"></div>
            <div class="slot-reel" id="reel-r"></div>
          </div>
          <div class="slot-notch l"></div>
          <div class="slot-notch r"></div>
        </div>
      </div>
    </div>

    <!-- 映像スクリーン -->
    <div class="video-screen">
      <div id="yt-player"></div>
      <div class="screen-overlay" id="screen-overlay">カセットをセットしてください</div>
    </div>

    <!-- トランスポートコントロール -->
    <div class="transport">
      <div class="t-item">
        <button class="t-btn" id="btn-rw"   onclick="doRW()">⏮</button>
        <div class="t-label">巻き戻し</div>
      </div>
      <div class="t-item">
        <button class="t-btn" id="btn-stop" onclick="doStop()">⏹</button>
        <div class="t-label">停　止</div>
      </div>
      <div class="t-item">
        <button class="t-btn" id="btn-play" onclick="doPlay()">▶</button>
        <div class="t-label">再生 / 一時停止</div>
      </div>
      <div class="t-item">
        <button class="t-btn" id="btn-ff"   onclick="doFF()">⏭</button>
        <div class="t-label">早　送　り</div>
      </div>
    </div>

  </div>

  <!-- 右：カセット棚 -->
  <div class="shelf-panel">
    <div class="shelf-header">カ セ ッ ト リ ス ト</div>
    <div class="shelf-list" id="shelf-list"></div>
    <button class="add-btn" onclick="openDialog()">＋ カセットを追加する</button>
  </div>

</div>

<!-- ドラッグゴースト -->
<div class="ghost" id="ghost"><div class="ghost-label" id="ghost-label"></div></div>

<!-- 追加ダイアログ -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <h2>カセットを追加する</h2>
    <label for="d-url">YouTube URL</label>
    <input type="text" id="d-url" placeholder="https://youtu.be/XXXXX">
    <label for="d-title" style="display:flex;align-items:baseline;gap:8px;">
      タイトル
      <span style="font-size:0.75rem;font-weight:400;color:#8a8e95;">タイトルは自動取得されます</span>
    </label>
    <input type="text" id="d-title" placeholder="例：津軽じょんがら節">
    <div class="d-error" id="d-error"></div>
    <div class="d-btns">
      <button class="d-ok" onclick="addCassette()">追加する</button>
      <button class="d-cancel" onclick="closeDialog()">キャンセル</button>
    </div>
  </div>
</div>

<script>
// ── カセットの色（並び順で順番に割り当て） ──
const CAS_COLORS = ['#2f3b52', '#5a2a2a', '#3d4a32', '#4a3a28', '#3a3d42', '#2a4a4a', '#4a2f40', '#5a4a2a'];
function casColor(item) {
  const i = loadList().findIndex(c => c.id === item.id);
  return CAS_COLORS[(i < 0 ? 0 : i) % CAS_COLORS.length];
}

// ── データ管理 ──
const KEY = 'minyou_v4';
function loadList() {
  return JSON.parse(localStorage.getItem(KEY) || 'null') || [
    { id: 1, title: '民謡', url: 'https://youtu.be/E_Fhr2FRjHM?si=V8TXJbjHAjqmdjxi' }
  ];
}
function saveList(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

function parseUrl(raw) {
  const lm = raw.match(/[?&]list=([^&\s]+)/);
  if (lm) return { type: 'playlist', id: lm[1] };
  const sm = raw.match(/youtu\.be\/([^?&\s]+)/);
  if (sm) return { type: 'video', id: sm[1] };
  const wm = raw.match(/[?&]v=([^&\s]+)/);
  if (wm) return { type: 'video', id: wm[1] };
  return null;
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── YouTube API ──
var ytPlayer = null, ytReady = false;

(function(){
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '100%', width: '100%',
    playerVars: { enablejsapi: 1, controls: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: function() { ytReady = true; },
      onStateChange: function(e) { syncBtn(e.data); }
    }
  });
};

function syncBtn(state) {
  const playing = (state === 1);
  document.getElementById('btn-play').textContent = playing ? '⏸' : '▶';
  document.getElementById('btn-play').classList.toggle('on', playing);
  document.getElementById('reel-l').classList.toggle('spin', playing);
  document.getElementById('reel-r').classList.toggle('spin', playing);
}

function doPlay() {
  if (!ytReady || !loadedItem) return;
  ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
}
function doStop() {
  if (!ytReady) return;
  ytPlayer.stopVideo();
  syncBtn(2);
}
function doRW() { if (ytReady) ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 15), true); }
function doFF() { if (ytReady) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 15, true); }

// ── ロード済みカセット ──
var loadedItem = null;

function setCassette(item) {
  loadedItem = item;
  document.getElementById('slot-hint').style.display = 'none';
  document.getElementById('slot-label').textContent = item.title;
  const cas = document.getElementById('slot-cassette');
  cas.style.setProperty('--cas', casColor(item));
  cas.classList.remove('loaded');
  void cas.offsetWidth;
  cas.classList.add('loaded');
  document.getElementById('screen-overlay').classList.add('hidden');

  if (ytReady) {
    const p = parseUrl(item.url);
    if (p) {
      if (p.type === 'playlist') ytPlayer.loadPlaylist({ list: p.id, listType: 'playlist' });
      else ytPlayer.loadVideoById(p.id);
    }
  }
  renderShelf();
}

// ── 棚レンダリング ──
function renderShelf() {
  const list = loadList();
  const el = document.getElementById('shelf-list');
  el.innerHTML = '';
  list.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'shelf-item' + (loadedItem && loadedItem.id === item.id ? ' in-player' : '');

    const cas = document.createElement('div');
    cas.className = 'shelf-cassette';
    cas.style.setProperty('--cas', CAS_COLORS[i % CAS_COLORS.length]);

    const label = document.createElement('div');
    label.className = 'shelf-cas-label';
    label.textContent = item.title;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '✕';
    del.title = '削除';
    del.addEventListener('click', function(e) {
      e.stopPropagation();
      deleteCassette(item.id);
    });

    cas.appendChild(label);
    cas.appendChild(del);
    div.appendChild(cas);
    addDrag(div, item);
    el.appendChild(div);
  });
}

function deleteCassette(id) {
  if (!confirm('このカセットを削除しますか？')) return;
  if (loadedItem && loadedItem.id === id) {
    loadedItem = null; doStop();
    document.getElementById('slot-hint').style.display = '';
    document.getElementById('slot-cassette').classList.remove('loaded');
    document.getElementById('screen-overlay').classList.remove('hidden');
  }
  saveList(loadList().filter(c => c.id !== id));
  renderShelf();
}

// ── ドラッグ＆ドロップ ──
var dragData = null;
var ghost = document.getElementById('ghost');
var ghostLabel = document.getElementById('ghost-label');
var dropZone = document.getElementById('drop-zone');

function addDrag(el, item) {
  el.addEventListener('pointerdown', function(e) {
    if (e.target.classList.contains('del-btn')) return;
    e.preventDefault();
    dragData = item;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    ghostLabel.textContent = item.title;
    ghost.style.setProperty('--cas', casColor(item));
    ghost.classList.add('show');
    moveGhost(e.clientX, e.clientY);
  });
  el.addEventListener('pointermove', function(e) {
    if (!dragData) return;
    moveGhost(e.clientX, e.clientY);
    dropZone.classList.toggle('drag-over', isOver(e.clientX, e.clientY));
  });
  el.addEventListener('pointerup', function(e) {
    if (!dragData) return;
    if (isOver(e.clientX, e.clientY)) setCassette(dragData);
    endDrag(el);
  });
  el.addEventListener('pointercancel', function() { endDrag(el); });
}

function endDrag(el) {
  el.classList.remove('dragging');
  dropZone.classList.remove('drag-over');
  ghost.classList.remove('show');
  dragData = null;
}
function moveGhost(x, y) {
  ghost.style.left = (x - 80) + 'px';
  ghost.style.top  = (y - 24) + 'px';
}
function isOver(x, y) {
  const r = dropZone.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

// ── ダイアログ ──
function openDialog() {
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('d-title').focus(), 50);
}
function closeDialog() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('d-title').value = '';
  document.getElementById('d-url').value = '';
  document.getElementById('d-error').textContent = '';
}
function addCassette() {
  const title = document.getElementById('d-title').value.trim();
  const url   = document.getElementById('d-url').value.trim();
  const err   = document.getElementById('d-error');
  if (!title)         { err.textContent = 'タイトルを入力してください'; return; }
  if (!parseUrl(url)) { err.textContent = '有効なYouTube URLを入力してください'; return; }
  const list = loadList();
  if (list.length >= 10) { err.textContent = 'カセットは10個までです'; return; }
  list.push({ id: Date.now(), title, url });
  saveList(list);
  closeDialog();
  renderShelf();
}

document.getElementById('d-url').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('d-title').focus(); });
document.getElementById('d-title').addEventListener('keydown', e => { if (e.key === 'Enter') addCassette(); });
document.getElementById('overlay').addEventListener('click', function(e) { if (e.target === this) closeDialog(); });

// URL 入力でタイトルを自動取得
let fetchTimer = null;
document.getElementById('d-url').addEventListener('input', function() {
  clearTimeout(fetchTimer);
  const url = this.value.trim();
  if (!url) return;
  fetchTimer = setTimeout(() => autoFetchTitle(url), 700);
});

async function autoFetchTitle(url) {
  const titleEl = document.getElementById('d-title');
  const errEl   = document.getElementById('d-error');
  if (titleEl.value.trim()) return; // 手入力済みなら上書きしない
  errEl.textContent = 'タイトルを取得中...';
  try {
    const res = await fetch(
      'https://www.youtube.com/oembed?url=' + encodeURIComponent(url) + '&format=json'
    );
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (data.title) {
      titleEl.value = data.title;
      errEl.textContent = '';
    }
  } catch(e) {
    errEl.textContent = 'タイトルを自動取得できませんでした。手入力してください。';
  }
}

// ── 初期化 ──
renderShelf();
</script>
